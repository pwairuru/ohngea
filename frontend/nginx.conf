# Ohngea PBX frontend — serves vite build, proxies backend paths to the api service.
# Backend prefixes used by the SPA: /api, /auth, /health, /provision (+ /docs, /openapi.json).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Login responses carry large JWT headers; defaults (4k/8k) 502 on /auth/login.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Admin JWTs embed the full permission list (~8.5k as of 2026-09) and ride
    # in Authorization on every API call; nginx default 8k header buffers 400.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Backend API (same-origin, no CORS needed)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /provision/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Static SPA with fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
