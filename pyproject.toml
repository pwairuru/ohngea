[project]
name = "ohngea-pbx"
version = "0.1.0"
description = "Ohngea PBX Clone — FastAPI + SQLModel + PostgreSQL RLS + per-tenant partitioning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ohngea PBX" }]
keywords = ["ohngea", "fastapi", "voip", "freeswitch"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pydantic-xml>=2.13",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "httpx>=0.27,<0.29",
    "anyio>=4",
    "python-multipart>=0.0.9",
    "lxml>=5",
    "jinja2>=3.1",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "uuid6>=2024.7",
    "redis>=5.0",
    "celery>=5.3",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<0.29",
    "anyio[trio]>=4",
]
worker = [
    "celery>=5.3",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<0.29",
]

[project.scripts]
ohngea-import = "app.cli.import_legacy:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
