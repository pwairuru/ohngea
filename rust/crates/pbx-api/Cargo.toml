[package]
name = "pbx-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "pbx_api"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
pbx-core = { path = "../pbx-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
