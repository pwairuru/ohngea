[package]
name = "pbx-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "pbx_api"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower = "0.5"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v5", "serde"] }
pbx-core = { path = "../pbx-core" }
pbx-db = { path = "../pbx-db" }
pbx-fs = { path = "../pbx-fs" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
