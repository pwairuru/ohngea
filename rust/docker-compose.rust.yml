# Rust parity service overlay (Task 5 contract harness).
# Usage: docker compose -f docker-compose.yml -f rust/docker-compose.rust.yml up -d rust-api
# Build context is the repo ROOT with rust/Dockerfile (provision
# include_str! needs root templates/; multi-stage rust -> debian-slim).
# 16k header tolerance: axum 0.8 serve has no max_buf_size hook — enforce at
# edge proxy with `large_client_header_buffers 4 16k;` (see pbx-api MAX_HEADER_BYTES).
services:
  rust-api:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    ports: ["8000:8000"]
    environment:
      # Parity with main stack (docker-compose.yml api/worker).
      # RULING: sqlx scheme — postgresql:// (NOT postgresql+asyncpg://, which
      # is a Python/SQLAlchemy scheme). pbx-api still normalizes legacy
      # postgresql+asyncpg:// / postgresql:// → postgres:// for SeaORM.
      DATABASE_URL: postgresql://ohngea:ohngea@db:5432/ohngea
      JWT_SECRET: test-secret
    depends_on:
      db:
        condition: service_healthy
