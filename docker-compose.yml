services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ohngea
      POSTGRES_PASSWORD: ohngea
      POSTGRES_DB: ohngea
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohngea"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  freeswitch-mock:
    image: python:3.14-slim
    ports:
      - "8021:8021"
    volumes:
      - ./app:/app/app
    working_dir: /app
    command: python -m app.freeswitch.mock_esl_server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; sys.exit(0 if socket.socket().connect_ex((\"127.0.0.1\",8021))==0 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      # Host 9000/9001 clash with other apps on dev machines; container ports stay
      # 9000/9001 (api reaches minio:9000 internally; host only needs the console).
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ohngea-recordings
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      # Host port follows $API_PORT from root .env (default 8010; host 8000 is taken
      # by bifrost-llm-proxy). Container port stays 8000 (FS xml_curl/cdr use http://api:8000).
      - "${API_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ohngea:ohngea@db:5432/ohngea
      VALKEY_URL: valkey://valkey:6379/0
      # REDIS_URL kept for backwards compat (celery/kombu still require redis:// scheme)
      REDIS_URL: redis://valkey:6379/0
      FS_ESL_HOST: freeswitch-mock
      FS_ESL_PORT: 8021
      FS_ESL_PASSWORD: ClueCon
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ohngea-recordings
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      freeswitch-mock:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./docker/freeswitch/conf:/app/freeswitch_conf
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      # UI host port follows $FRONTEND_PORT from root .env (default 8060).
      # Proxies /api /auth /health /provision to api:8000 (see frontend/nginx.conf).
      - "${FRONTEND_PORT:-8060}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ohngea:ohngea@db:5432/ohngea
      VALKEY_URL: valkey://valkey:6379/0
      REDIS_URL: redis://valkey:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ohngea-recordings
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FS_ESL_HOST: freeswitch-mock
      FS_ESL_PORT: 8021
      FS_ESL_PASSWORD: ClueCon
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --beat
    profiles:
      - worker

  worker-beat:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ohngea:ohngea@db:5432/ohngea
      VALKEY_URL: valkey://valkey:6379/0
      REDIS_URL: redis://valkey:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ohngea-recordings
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    profiles:
      - worker

volumes:
  pgdata:
  valkeydata:
  miniodata:
