# mfsBSD config for Ohngea 15.1 ISO
# See https://mmatalka.github.io/mfsbsd/
MFSBSD_CUSTOM=1
BASE=/tmp/base.txz
MFSBSD_PORTS_DIR=/usr/ports
MFSBSD_WORKDIR=/tmp/mfsbsd-work
# Include our pkg repo
MFSBSD_PACKAGES_DIR=/tmp/mfsbsd-packages
# Custom files overlay
CUSTOMFILES_DIR=freebsd/mfsbsd/customfiles
# Network: DHCP default, SSH enabled
MFSBSD_HOSTNAME=ohngea
MFSBSD_NETWORK_DHCP=yes
# ZFS auto install via installerconfig
