# Ohngea turnkey vhost — installed as /usr/local/etc/ohngea/nginx/ohngea.conf.sample
# Copied to /usr/local/etc/nginx/ohngea.conf on first boot

upstream ohngea {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/local/www/ohngea/static;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Assets cache
    location /assets/ {
        alias /usr/local/www/ohngea/static/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest|mp4|webm)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Device provisioning (phone cfg fetch)
    location /provision/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Top-level auth helpers
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # API + health
    location /api/ {
        proxy_pass http://ohngea;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://ohngea/health;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://ohngea;
        proxy_set_header Host $host;
    }

    # FreeSWITCH mod_xml_curl (internal)
    location /api/internal/freeswitch/ {
        proxy_pass http://ohngea;
        proxy_set_header Host $host;
        # restrict to localhost/Freeswitch if needed:
        # allow 127.0.0.1; deny all;
    }

    # WSS to FreeSWITCH
    # probe sockstat 5066 else drop
    location /wss/ {
        proxy_pass http://127.0.0.1:5066/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/ohngea_access.log main;
    error_log /var/log/nginx/ohngea_error.log;
}
