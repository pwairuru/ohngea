# Ohngea turnkey nginx.conf — main config
# Installed as /usr/local/etc/ohngea/nginx/nginx.conf.sample
# Copied to /usr/local/etc/nginx/nginx.conf on first boot if not exists

user www;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    # 16k edge rule: oversized headers are rejected here, never in axum.
    large_client_header_buffers 4 16k;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Ohngea — include turnkey vhost
    include /usr/local/etc/nginx/ohngea.conf;
    # Also allow drop-in vhosts
    include /usr/local/etc/nginx/sites-enabled/*.conf;
}
