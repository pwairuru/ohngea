# Real FreeSWITCH for dev (alternative to `freeswitch-mock`).
# Proven 2026-11-16: backend `connected:true`, 4 RUNNING sofia profiles,
# extension create + gateway rescan over live ESL.
#
# Why the custom ESL config: the image's vanilla `listen-ip ::` fails to bind
# (no IPv6 in container) and the default loopback ACL rejects the Docker
# bridge gateway. This file binds 0.0.0.0 and allows RFC1918 (`lan`).
# Mounted onto the image's vanilla source path because the entrypoint
# copies vanilla -> /etc/freeswitch on every boot.
services:
  freeswitch-real:
    image: safarov/freeswitch:latest
    container_name: pbx-fs-real
    ports:
      - "8021:8021"
      - "5060:5060/udp"
      - "5080:5080/udp"
    volumes:
      - ./docker/freeswitch/event_socket.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/event_socket.conf.xml:ro
    restart: unless-stopped
