# E2E overlay: real FreeSWITCH + scripted endpoints wired to the API.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
#
# The api service is overridden to point ESL at the real FreeSWITCH instead of
# the mock. See docs/e2e-testing.md and Makefile targets e2e-*.
services:
  freeswitch:
    # community Debian image with the full module set (mod_xml_curl, mod_xml_cdr,
    # mod_sofia, fs_cli). The official signalwire images now require registry auth.
    # Pinned 2026-09-25: safarov/freeswitch@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6
    image: safarov/freeswitch:latest@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6
    command: ["freeswitch", "-nonat", "-nf"]
    environment:
      LAN_IP: ${LAN_IP:-192.168.100.82}
    volumes:
      - ./docker/freeswitch/conf:/etc/freeswitch
    ports:
      - "5060:5060/udp"
      - "5066:5066"
      - "7443:7443"
      - "8022:8021"
      - "16384-16386:16384-16386/udp"
    depends_on:
      api:
        condition: service_healthy

  phone1001:
    build: ./docker/sipphone
    restart: unless-stopped
    environment:
      SIP_EXT: "1001"
      SIP_DOMAIN: test.example.com
    depends_on:
      - freeswitch

  phone1002:
    build: ./docker/sipphone
    restart: unless-stopped
    environment:
      SIP_EXT: "1002"
      SIP_DOMAIN: test.example.com
    depends_on:
      - freeswitch

  api:
    environment:
      # talk to the real FreeSWITCH event socket instead of the mock
      FS_ESL_HOST: freeswitch
